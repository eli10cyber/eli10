<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">DNSSEC chain of trust</title>
  <desc id="d">Three address books, root, .com and eli10cyber.com, each with a wax seal. Each parent vouches for its child's seal, and the browser checks every seal on the way down.</desc>
  <rect width="720" height="360" rx="24" fill="#fbf7ef"/>
  <g font-family="ui-rounded, 'SF Pro Rounded', system-ui, sans-serif" fill="#1d1f26">
    <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="800">Each book vouches for the next one’s seal</text>

    <!-- Books -->
    <g transform="translate(40 80)">
      <rect width="170" height="130" rx="14" fill="#ffffff" stroke="#1d1f26" stroke-width="3"/>
      <rect width="170" height="34" rx="14" fill="#2f6fdb" stroke="#1d1f26" stroke-width="3"/>
      <text x="85" y="23" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Root ( . )</text>
      <path d="M20 60h110M20 80h80M20 100h120" stroke="#e4dccb" stroke-width="8" stroke-linecap="round"/>
      <circle cx="140" cy="112" r="22" fill="#d6423b" stroke="#1d1f26" stroke-width="3"/>
      <text x="140" y="118" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">✓</text>
    </g>
    <g transform="translate(275 80)">
      <rect width="170" height="130" rx="14" fill="#ffffff" stroke="#1d1f26" stroke-width="3"/>
      <rect width="170" height="34" rx="14" fill="#2f6fdb" stroke="#1d1f26" stroke-width="3"/>
      <text x="85" y="23" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">.com</text>
      <path d="M20 60h110M20 80h80M20 100h120" stroke="#e4dccb" stroke-width="8" stroke-linecap="round"/>
      <circle cx="140" cy="112" r="22" fill="#d6423b" stroke="#1d1f26" stroke-width="3"/>
      <text x="140" y="118" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">✓</text>
    </g>
    <g transform="translate(510 80)">
      <rect width="170" height="130" rx="14" fill="#ffffff" stroke="#1d1f26" stroke-width="3"/>
      <rect width="170" height="34" rx="14" fill="#e8692c" stroke="#1d1f26" stroke-width="3"/>
      <text x="85" y="23" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">eli10cyber.com</text>
      <text x="20" y="68" font-size="14" font-weight="700">Address:</text>
      <text x="20" y="90" font-size="14" font-family="ui-monospace, Menlo, monospace">203.0.113.7</text>
      <circle cx="140" cy="112" r="22" fill="#d6423b" stroke="#1d1f26" stroke-width="3"/>
      <text x="140" y="118" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">✓</text>
    </g>

    <!-- Arrows -->
    <g stroke="#2f9e6b" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M212 145h58"/><path d="M262 137l10 8-10 8"/>
      <path d="M447 145h58"/><path d="M497 137l10 8-10 8"/>
    </g>
    <text x="241" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e6b">vouches</text>
    <text x="476" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#2f9e6b">vouches</text>

    <!-- Browser -->
    <g transform="translate(250 250)">
      <rect width="220" height="76" rx="14" fill="#fff4d6" stroke="#1d1f26" stroke-width="3"/>
      <text x="110" y="32" text-anchor="middle" font-size="16" font-weight="800">Your resolver checks</text>
      <text x="110" y="56" text-anchor="middle" font-size="16" font-weight="800">every seal ✓ ✓ ✓</text>
    </g>
    <text x="100" y="300" text-anchor="middle" font-size="14" fill="#4a4e5a">Seal = digital signature</text>
    <text x="620" y="300" text-anchor="middle" font-size="14" fill="#4a4e5a">Broken seal = answer rejected</text>
  </g>
</svg>
